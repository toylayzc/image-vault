server {
    listen 80;
    server_name 120.55.48.250;

    # 前端静态文件
    root /www/wwwroot/api/dist;
    index index.html;

    # API 代理
    location /upload-token {
        proxy_pass http://127.0.0.1:3000/upload-token;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /batch-delete {
        proxy_pass http://127.0.0.1:3000/batch-delete;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA 路由（所有非文件请求返回 index.html）
    location / {
        try_files $uri $uri/ /index.html;
    }
}
